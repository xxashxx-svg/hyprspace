[package]
name = "hyprspace-tauri"
version = "0.13.2"
description = "A multi-terminal AI workspace — tile coding agents across projects, then automate them."
authors = ["HyprSpace contributors"]
license = "MIT"
repository = "https://github.com/xxashxx-svg/hyprspace"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hyprspace_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
ed25519-dalek = "2"
base64 = "0.22"
# just PNG encode/decode, for turning a pasted clipboard image into a temp file
image = { version = "0.25", default-features = false, features = ["png"] }

# OS keychain for loop-agent API keys (Windows Credential Manager / macOS Keychain).
# per-target so each platform pulls only its native backend.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }


# smaller + faster shipped binary (auto-update download size matters). thin LTO keeps the
# release build time sane vs full; panic stays "unwind" — the poison-tolerant locks rely on it.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
