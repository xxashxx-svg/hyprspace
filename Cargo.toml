[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/harness",
    "crates/engine",
    "crates/syntax",
    "crates/theme",
    "crates/ui",
    "crates/update",
    "apps/hyprspace",
]
# The Android app is its own Gradle project, not part of this workspace.
exclude = ["mobile"]

[workspace.package]
# The app's version, for every crate. deploy.ps1 bumps it with each release (docs/operations/release.md);
# never edit it by hand. It continues the Tauri app's numbering, so that app's updater saw the
# first GPUI release as newer.
version = "0.24.14"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
hyprspace-proto = { path = "crates/proto" }
hyprspace-harness = { path = "crates/harness" }
hyprspace-engine = { path = "crates/engine" }
hyprspace-syntax = { path = "crates/syntax" }
hyprspace-theme = { path = "crates/theme" }
hyprspace-ui = { path = "crates/ui" }
hyprspace-update = { path = "crates/update" }

# GPUI from one upstream Zed commit, all three crates at the same rev.
# Why upstream and not a fork: docs/internals/overview.md, GPUI.
gpui = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8", features = ["font-kit"] }

alacritty_terminal = "0.26"
portable-pty = "0.9"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
# usage endpoints (engine/src/usage/live.rs); rustls so no OpenSSL is needed on any build host
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
# ids for steer messages claude echoes back (harness/src/claude)
uuid = { version = "1", features = ["v4"] }
# transcript markdown (ui/src/markdown); MIT, and what zeron uses instead of Zed's GPL markdown
pulldown-cmark = { version = "0.13", default-features = false }
# cursor moves by grapheme in text boxes (ui/src/input)
unicode-segmentation = "1"
# a pasted bitmap saved as png for the agents (ui/src/attach.rs); gpui already builds this crate
# local clock times and days for Settings' Usage (ui/src/usage); gpui already builds this crate
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp"] }

[profile.dev]
opt-level = 0
# File and line in a backtrace, without the full symbols that had every link write a 300 MB pdb.
debug = "line-tables-only"

# gpui is slow unoptimized, so dependencies build optimized even in dev (zeron and Zed do the same).
# Nobody steps through them, so they carry no debug info, which keeps links quick.
[profile.dev.package."*"]
opt-level = 2
debug = false
