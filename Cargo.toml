[workspace]
resolver = "2"
members = ["apps/hyprspace"]
# The Tauri app builds on its own until the GPUI app reaches parity (docs/REWRITE.md).
exclude = ["src-tauri", "mobile"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# GPUI from one upstream Zed commit, all three crates at the same rev.
# Why upstream and not a fork: docs/adr/0001-gpui-source.md.
gpui = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8", features = ["font-kit"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "20d29fc6bc2fc2b58d1fff8d8e0503b9ba7f41d8" }

alacritty_terminal = "0.26"
portable-pty = "0.9"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync"] }
futures = "0.3"
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 0

# gpui is slow unoptimized, so dependencies build optimized even in dev (zeron and Zed do the same).
[profile.dev.package."*"]
opt-level = 2
