name: upgrade-test

# Proves the last Tauri version updates into the GPUI app (docs/internals/updates.md). Each job builds and signs the GPUI app the way release.yml does, with the real
# updater key. It builds the Tauri app from a second checkout of the v0.21.1 tag, since that code
# left this branch, with one patch and three build overrides. The patch
# (scripts/tauri-autoinstall.patch) makes it press "Restart & update" itself when built with
# VITE_UPDATE_AUTOINSTALL=1, and is inert otherwise. The overrides point its feed at a server on
# the runner, set its version one below so the feed is newer, and turn off updater artifacts. Its
# real updater then downloads, verifies with the real public key, installs and relaunches, and
# scripts/check-upgrade-*.{ps1,sh} check what the user ends up with.
#
# Run: gh workflow run upgrade-test.yml --ref rewrite
# A push to rewrite that changes this file, the patch or the check scripts also runs it: GitHub
# only offers workflow_dispatch for a workflow it has seen run, and this one isn't on the default
# branch.
#
# It never creates, edits or uploads to a release: the token is read-only and nothing here calls
# `gh release`. Results are workflow artifacts (upgrade-windows, upgrade-macos).

on:
  workflow_dispatch:
  push:
    branches: [rewrite]
    paths:
      - .github/workflows/upgrade-test.yml
      - scripts/check-upgrade-*
      - scripts/tauri-autoinstall.patch

permissions:
  contents: read

env:
  # the Tauri release users have now, built from its tag with only the patch above on top
  LAST_TAURI: v0.21.1
  # what the test build of the Tauri app calls itself, so the GPUI version reads as newer
  TAURI_AS: "0.21.0"
  FEED_PORT: "8765"
  TAURI_CLI: "@tauri-apps/cli@2.11.2"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the LAST_TAURI tag
      # Outside this checkout: inside it, the root Cargo workspace would claim src-tauri.
      - name: The Tauri app under test is the last release's code
        shell: bash
        run: |
          tauri="$RUNNER_TEMP/tauri"
          git worktree add --detach "$tauri" "$LAST_TAURI"
          # applied to the index, where the file is LF as committed, then written out
          git -C "$tauri" apply --cached "$GITHUB_WORKSPACE/scripts/tauri-autoinstall.patch"
          git -C "$tauri" checkout -- src/components/Updater.tsx
          changed=$(git -C "$tauri" status --porcelain)
          echo "changed from $LAST_TAURI: ${changed:-nothing}"
          if [ "$changed" != "M  src/components/Updater.tsx" ]; then
            echo "::error::The Tauri app differs from $LAST_TAURI beyond the test switch in Updater.tsx"
            exit 1
          fi
          git -C "$tauri" diff --cached
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: upgrade-test
          workspaces: |
            . -> target
            ${{ runner.temp }}/tauri/src-tauri -> target
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build the GPUI app and its installer (as release.yml does)
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Sign it with the updater key (as release.yml does)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          setup="HyprSpace_${version}_x64-setup.exe"
          mkdir -p feed
          cp "target/package/$setup" feed/
          npx --yes "$TAURI_CLI" signer sign "feed/$setup"
          cargo run -q --locked -p hyprspace-update --example verify -- "feed/$setup"
      - name: The feed, as release.yml writes it, served from this runner
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          node scripts/ci-build-latest.mjs "v$version" feed "$GITHUB_REPOSITORY"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("feed/latest.json", "utf8"));
            for (const a of Object.values(m.platforms)) a.url = "http://127.0.0.1:" + process.env.FEED_PORT + "/" + a.url.split("/").pop();
            fs.writeFileSync("feed/latest.json", JSON.stringify(m, null, 2));
          '
          cat feed/latest.json
      - name: Build the Tauri app with its feed on this runner
        shell: bash
        working-directory: ${{ runner.temp }}/tauri
        env:
          VITE_UPDATE_AUTOINSTALL: "1"
        run: |
          npm ci
          conf="{\"version\":\"$TAURI_AS\",\"bundle\":{\"createUpdaterArtifacts\":false},\"plugins\":{\"updater\":{\"endpoints\":[\"http://127.0.0.1:$FEED_PORT/latest.json\"],\"dangerousInsecureTransportProtocol\":true}}}"
          node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config "$conf"
      - name: Let the Tauri app update itself into the GPUI app
        shell: pwsh
        run: |
          $old = (Get-Item "$env:RUNNER_TEMP/tauri/src-tauri/target/release/bundle/nsis/HyprSpace_${env:TAURI_AS}_x64-setup.exe").FullName
          ./scripts/check-upgrade-windows.ps1 -Old $old -Feed feed -Out upgrade-logs -Port $env:FEED_PORT
      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-windows
          path: |
            upgrade-logs/
            feed/latest.json

  macos:
    runs-on: macos-14 # Apple silicon, like darwin-aarch64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Outside this checkout: inside it, the root Cargo workspace would claim src-tauri.
      - name: The Tauri app under test is the last release's code
        run: |
          tauri="$RUNNER_TEMP/tauri"
          git worktree add --detach "$tauri" "$LAST_TAURI"
          # applied to the index, where the file is LF as committed, then written out
          git -C "$tauri" apply --cached "$GITHUB_WORKSPACE/scripts/tauri-autoinstall.patch"
          git -C "$tauri" checkout -- src/components/Updater.tsx
          changed=$(git -C "$tauri" status --porcelain)
          echo "changed from $LAST_TAURI: ${changed:-nothing}"
          if [ "$changed" != "M  src/components/Updater.tsx" ]; then
            echo "::error::The Tauri app differs from $LAST_TAURI beyond the test switch in Updater.tsx"
            exit 1
          fi
          git -C "$tauri" diff --cached
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      # GPUI compiles its Metal shaders at build time; Xcode 26 ships the Metal toolchain apart
      - name: Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: upgrade-test
          workspaces: |
            . -> target
            ${{ runner.temp }}/tauri/src-tauri -> target
      # ad hoc signed, as release.yml does until the Apple secrets exist
      - name: Build and bundle the GPUI app (as release.yml does)
        run: bash scripts/package-macos.sh
      - name: Sign it with the updater key (as release.yml does)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p feed
          cp target/package/HyprSpace.app.tar.gz feed/
          npx --yes "$TAURI_CLI" signer sign feed/HyprSpace.app.tar.gz
          cargo run -q --locked -p hyprspace-update --example verify -- feed/HyprSpace.app.tar.gz
      - name: The feed, as release.yml writes it, served from this runner
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          node scripts/ci-build-latest.mjs "v$version" feed "$GITHUB_REPOSITORY"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("feed/latest.json", "utf8"));
            for (const a of Object.values(m.platforms)) a.url = "http://127.0.0.1:" + process.env.FEED_PORT + "/" + a.url.split("/").pop();
            fs.writeFileSync("feed/latest.json", JSON.stringify(m, null, 2));
          '
          cat feed/latest.json
      - name: Build the Tauri app with its feed on this runner
        working-directory: ${{ runner.temp }}/tauri
        env:
          VITE_UPDATE_AUTOINSTALL: "1"
        run: |
          npm ci
          conf="{\"version\":\"$TAURI_AS\",\"bundle\":{\"createUpdaterArtifacts\":false},\"plugins\":{\"updater\":{\"endpoints\":[\"http://127.0.0.1:$FEED_PORT/latest.json\"],\"dangerousInsecureTransportProtocol\":true}}}"
          node node_modules/@tauri-apps/cli/tauri.js build --bundles app --config "$conf"
      - name: Let the Tauri app update itself into the GPUI app
        run: bash scripts/check-upgrade-macos.sh "$RUNNER_TEMP/tauri/src-tauri/target/release/bundle/macos/HyprSpace.app" feed upgrade-logs "$FEED_PORT"
      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-macos
          path: |
            upgrade-logs/
            feed/latest.json
