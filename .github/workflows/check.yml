name: check

# The check (AGENTS.md, Run, check, ship): fmt, clippy with warnings as errors, and the
# tests, for the whole Cargo workspace on Windows and macOS, and the Android app's tests and
# build. A red check blocks a merge.

on:
  push:
    branches: [main, rewrite]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/**"
      - "crates/**"
      - "mobile/**"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      # The same toolchain Zed pins at our GPUI rev, so fmt and clippy match a local run.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      # GPUI compiles its Metal shaders at build time with `xcrun metal`. Xcode 26 ships the
      # Metal toolchain as a separate download, so fetch it when the runner image lacks it.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - uses: Swatinem/rust-cache@v2
        with:
          # only pushed branches write the cache; pull requests restore it
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  # The Android app, against the wire fixtures the desktop's tests keep current.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: test and build
        working-directory: mobile
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
