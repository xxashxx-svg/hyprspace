name: release

# CI builds the GPUI app for Windows and macOS and signs what the updaters install with the
# updater key held in this repo's secrets, so no machine has to keep that key. deploy.ps1 bumps
# the version, tags, opens the release as a DRAFT with the notes, and runs this workflow. Each
# job MERGES its own entry into the release's latest.json (windows-x86_64, then darwin-aarch64),
# and the last job (macos) publishes the draft, so the updater endpoint (releases/latest) only
# sees the release once it is complete. The installed Tauri app reads that same latest.json and
# key, so the first GPUI release installs through it (docs/internals/updates.md).
#
# The jobs chain with `needs` on purpose: they all read-modify-write the same latest.json asset,
# so they must not run concurrently or one would clobber another's platform entry.
#
# Manual run:  gh workflow run release.yml -f tag=v0.22.0   (the release should already exist
#              from deploy.ps1; if not, the first job creates a draft).
# Dry run:     gh workflow run release.yml --ref rewrite -f dry_run=true
#              Builds and signs both platforms, installs the Windows installer over the last
#              Tauri release on the runner and uninstalls it, and keeps the installers, the
#              updater bundles, their .sig files and the would-be latest.json as workflow
#              artifacts. It never creates, edits or uploads to a release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Optional Apple signing
# and notarization secrets are used when present (scripts/package-macos.sh).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.22.0. A dry run may leave it empty."
        required: false
        default: ""
      dry_run:
        description: "Dry run: build, sign and check, keep artifacts, touch no release"
        type: boolean
        default: false
      android:
        description: "Also build + attach the Android app (mobile/)"
        type: boolean
        default: true
      desktop:
        description: "Build Windows and macOS. Off rebuilds only the APK for an existing release."
        type: boolean
        default: true

env:
  RELEASES_REPO: xxashxx-svg/hyprspace
  # signs the updater bundles the way tauri-action did, with the same key format
  TAURI_CLI: "@tauri-apps/cli@2.11.2"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    if: inputs.desktop
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.which.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Which release
        id: which
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${{ inputs.tag }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            tag="${tag:-v$version}"
          elif [ "$tag" != "v$version" ]; then
            echo "::error::The tag ($tag) must be v$version, the workspace version. deploy.ps1 bumps Cargo.toml before it tags."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build the app and its installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Sign the installer for the updaters
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          setup="HyprSpace_${{ steps.which.outputs.version }}_x64-setup.exe"
          mkdir -p dist
          cp "target/package/$setup" dist/
          npx --yes "$TAURI_CLI" signer sign "dist/$setup"
          # the app's own key must accept it, or no installed copy ever would
          cargo run -q --locked -p hyprspace-update --example verify -- "dist/$setup"
          # stable-named copy so the website's Download link always resolves to the newest build
          cp "dist/$setup" dist/HyprSpace-windows-x64-setup.exe
          echo "built:"; ls -la dist
      - name: Install over the last Tauri release, then a fresh install (dry run)
        if: inputs.dry_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist/HyprSpace_${{ steps.which.outputs.version }}_x64-setup.exe"
          gh release download v0.21.1 --repo $env:RELEASES_REPO --pattern "HyprSpace_0.21.1_x64-setup.exe" --dir old
          ./scripts/check-windows-install.ps1 -Setup $setup -Old old/HyprSpace_0.21.1_x64-setup.exe -Dir "$env:RUNNER_TEMP\upgrade"
          ./scripts/check-windows-install.ps1 -Setup $setup -Dir "$env:RUNNER_TEMP\fresh"
      - name: Would-be manifest (dry run)
        if: inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-build-latest.mjs "${{ steps.which.outputs.tag }}" dist "$RELEASES_REPO"
      - name: Keep the build (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
      - name: Merge windows into the release manifest + upload
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.which.outputs.tag }}"
          mkdir -p existing
          gh release download "$tag" --repo "$RELEASES_REPO" --pattern latest.json --dir existing 2>/dev/null || true
          node scripts/ci-build-latest.mjs "$tag" dist "$RELEASES_REPO" existing/latest.json
          echo "merged manifest:"; cat dist/latest.json
          if gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$RELEASES_REPO" --clobber dist/*-setup.exe dist/latest.json
          else
            gh release create "$tag" --repo "$RELEASES_REPO" --draft \
              --title "HyprSpace ${tag#v}" --notes "Automated release." \
              dist/*-setup.exe dist/latest.json
          fi

  macos:
    needs: windows
    runs-on: macos-14 # Apple Silicon → aarch64
    timeout-minutes: 90
    # releases live in this same repo, so the built-in token is the right credential — a PAT has to
    # be re-scoped whenever it expires, which is what broke the 0.12.0 darwin publish.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      # GPUI compiles its Metal shaders at build time; Xcode 26 ships the Metal toolchain apart
      - name: Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build, sign and bundle the app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/package-macos.sh
      - name: Sign the update for the updaters
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          cp target/package/HyprSpace.app.tar.gz target/package/HyprSpace_*_aarch64.dmg dist/
          npx --yes "$TAURI_CLI" signer sign dist/HyprSpace.app.tar.gz
          cargo run -q --locked -p hyprspace-update --example verify -- dist/HyprSpace.app.tar.gz
          # stable-named copy so the website's Download link always resolves to the newest build
          cp dist/HyprSpace_*_aarch64.dmg dist/HyprSpace-macos-aarch64.dmg
          echo "built:"; ls -la dist
      - name: Fetch the Windows half (dry run)
        if: inputs.dry_run
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: existing
      - name: Would-be manifest (dry run)
        if: inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci-build-latest.mjs "${{ needs.windows.outputs.tag }}" dist "$RELEASES_REPO" existing/latest.json
          cp dist/latest.json latest.json
      - name: Keep the build (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/
      - name: Keep the would-be latest.json (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: latest.json
          path: latest.json
      - name: Merge darwin into the release manifest + publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.windows.outputs.tag }}"
          mkdir -p existing
          # pull the existing manifest (the windows job uploaded its half first); ok if absent
          gh release download "$tag" --repo "$RELEASES_REPO" --pattern latest.json --dir existing 2>/dev/null || true
          node scripts/ci-build-latest.mjs "$tag" dist "$RELEASES_REPO" existing/latest.json
          echo "merged manifest:"; cat dist/latest.json
          if gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$RELEASES_REPO" --clobber dist/*.dmg dist/*.app.tar.gz dist/latest.json
          else
            gh release create "$tag" --repo "$RELEASES_REPO" --draft \
              --title "HyprSpace ${tag#v}" --notes "Automated release." \
              dist/*.dmg dist/*.app.tar.gz dist/latest.json
          fi
          # every platform is in: publish, which is when releases/latest starts pointing here
          gh release edit "$tag" --repo "$RELEASES_REPO" --draft=false

  # The Android app (mobile/, Kotlin and Compose). Its version is its own (hyprspace.version in
  # mobile/gradle.properties), so this only runs when you ask for it, and attaches the APK to the
  # same release, versioned and under a stable name.
  #
  # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (key alias "hyprspace", the same
  # password for the key). Without them the APK is signed with a throwaway debug key, which can't
  # update an install signed with the real one, so a real release must have them.
  android:
    if: inputs.android && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # checked here rather than in `if:`: a step's own env isn't visible to its condition
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set. This APK is debug-signed and can't update an install signed with the real key."
            exit 0
          fi
          mkdir -p ~/.hyprspace-signing
          echo "$KEYSTORE" | base64 -d > ~/.hyprspace-signing/android.jks
          chmod 700 ~/.hyprspace-signing && chmod 600 ~/.hyprspace-signing/android.jks
          {
            echo "HYPRSPACE_ANDROID_KEYSTORE=$HOME/.hyprspace-signing/android.jks"
            echo "HYPRSPACE_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "HYPRSPACE_ANDROID_KEY_ALIAS=hyprspace"
            echo "HYPRSPACE_ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Test and build the APK
        working-directory: mobile
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: mobile
        run: |
          tag="${{ inputs.tag }}"
          version=$(grep -m1 '^version = ' ../Cargo.toml | cut -d'"' -f2)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HyprSpace-android-$version.apk"
          # a stable name too, so a link to the app never goes stale
          cp app/build/outputs/apk/release/app-release.apk out/HyprSpace-android.apk
          gh release upload "$tag" --repo "$RELEASES_REPO" --clobber \
            "out/HyprSpace-android-$version.apk" out/HyprSpace-android.apk
