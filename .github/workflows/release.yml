name: release

# macOS-only CI: Windows is built locally with deploy.ps1 (free), so CI only does the
# thing you can't do on Windows — build + sign the macOS app. It then MERGES the
# darwin-aarch64 entry into the release's latest.json (preserving the windows entry
# deploy.ps1 published). deploy.ps1 triggers this automatically after it publishes.
#
# Manual run: gh workflow run release.yml -f tag=v0.2.4   (the release should already
# exist from deploy.ps1; if not, this creates a macOS-only one).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, RELEASES_TOKEN.
# Optional Apple signing/notarization secrets are read if present.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.4"
        required: true
      android:
        description: "Also build + attach the Android app (mobile/)"
        type: boolean
        default: false

env:
  RELEASES_REPO: xxashxx-svg/hyprspace

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon → aarch64
    # releases live in this same repo, so the built-in token is the right credential — a PAT has to
    # be re-scoped whenever it expires, which is what broke the 0.12.0 darwin publish.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: npm install
      - name: Build + sign macOS app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # For notarized Mac builds later: add the Apple secrets, then UNCOMMENT these.
          # (Passing them while empty makes tauri-action attempt codesign and fail, so they
          # stay commented until real certs exist.)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # the config's bundle target is nsis (Windows); override for the Mac app + updater tarball
          args: --target aarch64-apple-darwin --bundles app,dmg
      - name: Merge darwin into the release manifest + publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          mkdir -p dist existing
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} dist/ \;
          # stable-named copy so the website's Download link always resolves to the newest build
          cp dist/HyprSpace_*.dmg dist/HyprSpace-macos-aarch64.dmg
          echo "built:"; ls -la dist
          # pull the existing manifest (deploy.ps1 publishes the Windows half first); ok if absent
          gh release download "$tag" --repo "$RELEASES_REPO" --pattern latest.json --dir existing 2>/dev/null || true
          node scripts/ci-build-latest.mjs "$tag" dist "$RELEASES_REPO" existing/latest.json
          echo "merged manifest:"; cat dist/latest.json
          if gh release view "$tag" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$RELEASES_REPO" --clobber dist/*.dmg dist/*.app.tar.gz dist/latest.json
          else
            gh release create "$tag" --repo "$RELEASES_REPO" \
              --title "HyprSpace ${tag#v}" --notes "Automated release." \
              dist/*.dmg dist/*.app.tar.gz dist/latest.json
          fi

  # The Android companion app (mobile/). Independent of the desktop's version — it ships on its own
  # cadence — so this only runs when you ask for it, and attaches the APK to the same release under a
  # stable name the desktop's "get the app" link can point at.
  #
  # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (see mobile/README.md).
  # WITHOUT them the build still succeeds but is debug-signed, which CANNOT update an
  # existing install — so a real release must have them set.
  android:
    if: inputs.android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: mobile
        # the desktop's node_modules too: the terminal WebView is generated from its @xterm/xterm,
        # so both halves render with the same emulator (mobile/scripts/build-term.mjs)
        run: |
          npm install --prefix ..
          npm install
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # checked here rather than in `if:` — a step's own env isn't visible to its condition
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — this APK will be debug-signed and CANNOT update an existing install. Fine for a test build, not for a release."
            exit 0
          fi
          mkdir -p ~/.hyprspace-signing ~/.gradle
          echo "$KEYSTORE" | base64 -d > ~/.hyprspace-signing/hyprspace-mobile.jks
          chmod 700 ~/.hyprspace-signing && chmod 600 ~/.hyprspace-signing/hyprspace-mobile.jks
          {
            echo "HYPRSPACE_STORE_FILE=$HOME/.hyprspace-signing/hyprspace-mobile.jks"
            echo "HYPRSPACE_KEY_ALIAS=hyprspace"
            echo "HYPRSPACE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "HYPRSPACE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } > ~/.gradle/gradle.properties
          chmod 600 ~/.gradle/gradle.properties
      - name: Build the APK
        working-directory: mobile
        run: npm run apk
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: mobile
        run: |
          tag="${{ inputs.tag }}"
          version=$(node -p "require('./app.json').expo.version")
          # a stable name as well as the versioned one, so a "download the app" link never goes stale
          cp "build/HyprSpace-$version.apk" "build/HyprSpace-android.apk"
          gh release upload "$tag" --repo "$RELEASES_REPO" --clobber \
            "build/HyprSpace-$version.apk" "build/HyprSpace-android.apk"
