[package]
name = "hyprspace-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
hyprspace-proto.workspace = true
hyprspace-harness.workspace = true
hyprspace-update.workspace = true
tokio = { workspace = true, features = ["net"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
base64.workspace = true
alacritty_terminal.workspace = true

# the phone bridge (phone/): TLS under a certificate made on this machine, which the phone pins,
# and a WebSocket over it. aws-lc-rs because rustls already builds it for reqwest
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.10"
getrandom = "0.3"
if-addrs = "0.15"
# the bridge says where it is on the local network, so a paired phone finds it after the
# computer's address or port changed (phone/net.rs)
mdns-sd = "0.21"

# the processes under each terminal's shell, to see which agent runs there (running.rs); gpui's
# screen capture already builds this crate
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# read the machine and user PATH back from the registry (env.rs)
winreg = "0.55"

[dev-dependencies]
tempfile.workspace = true
