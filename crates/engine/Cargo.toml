[package]
name = "hyprspace-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
hyprspace-proto.workspace = true
hyprspace-harness.workspace = true
hyprspace-update.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
base64.workspace = true

# the processes under each terminal's shell, to see which agent runs there (running.rs); gpui's
# screen capture already builds this crate
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# read the machine and user PATH back from the registry (env.rs)
winreg = "0.55"

[dev-dependencies]
tempfile.workspace = true
