[package]
name = "hyprspace-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hyprspace-proto.workspace = true
hyprspace-theme.workspace = true
hyprspace-syntax.workspace = true
hyprspace-media.workspace = true
hyprspace-notify.workspace = true
gpui.workspace = true
alacritty_terminal.workspace = true
# the pairing code in Settings, Phone (phone/qr.rs)
qrcode = { version = "0.14", default-features = false }
futures.workspace = true
pulldown-cmark.workspace = true
unicode-segmentation.workspace = true
image.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# the clipboard's change count, to tell a copy that landed (clipboard.rs)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange"] }
