[package]
name = "hyprspace-far"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aws-lc"]
# the desktop already builds aws-lc for rustls; the Android library builds ring, which needs no CMake
aws-lc = ["iroh/tls-aws-lc-rs"]
ring = ["iroh/tls-ring"]

[dependencies]
iroh = { version = "1.4.1", default-features = false }
tokio = { version = "1", features = ["io-util", "sync", "time"] }
